data:
  schema: public
  table: flats_dataset_clean

split:
  test_size: 0.2
  random_state: 42

features:
  numeric:
    - floor
    - is_apartment
    - kitchen_area
    - living_area
    - rooms
    - total_area
    - build_year
    - latitude
    - longitude
    - ceiling_height
    - flats_count
    - floors_total
    - has_elevator
  categorical:
    - building_type_int

model:
  loss: absolute_error
  learning_rate: 0.1
  max_iter: 200
  max_leaf_nodes: 31
  min_samples_leaf: 20
  l2_regularization: 1.0
  early_stopping: false
  random_state: 42
  n_threads: 2
